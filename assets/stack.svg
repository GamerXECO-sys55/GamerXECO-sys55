<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="242" viewBox="0 0 1200 242" role="img" aria-label="Tech Arsenal: Arch Linux, Hyprland, Wayland, Quickshell, QML, Waybar, archiso, PKGBUILD, pacman, Calamares, systemd, Plymouth, SDDM, GRUB, Bash, mkdocs">
