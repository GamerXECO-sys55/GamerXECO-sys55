      <stop offset="55%" stop-color="#00e5c3"/>
      <stop offset="100%" stop-color="#8be9fd"/>
    </linearGradient>
    <linearGradient id="surfk" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#081826"/>
      <stop offset="100%" stop-color="#04080e"/>
